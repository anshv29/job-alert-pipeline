# =============================================================================
#  JOB ALERT SETTINGS
#  This is the only file most people ever need to edit.
#  Lines starting with # are notes for you. The program ignores them.
#  Be careful to keep the spaces at the start of lines exactly as they are.
# =============================================================================


# -----------------------------------------------------------------------------
# STEP 1. PICK YOUR PRESET (this is the one line most people change)
#   finance = banking, trading, research, asset management, risk, accounting...
#   tech    = software, data, machine learning, quant
# -----------------------------------------------------------------------------
preset: finance


# -----------------------------------------------------------------------------
# STEP 2. YOUR TARGET
# -----------------------------------------------------------------------------
target:
  # Only jobs that mention one of these years are kept.
  # Example: [2027] finds "Summer 2027", "Winter 2027 Co-op", "Class of 2027".
  # Add 2026 if you also want co-ops that start this year: [2026, 2027]
  years: [2027]

  # Skip jobs whose location contains any of these words. Leave the list empty to see every location.
  # Example for someone in North America who does not want overseas jobs:
  #   exclude_locations: [london, hong kong, singapore, tokyo, mumbai, dublin, frankfurt, sydney]
  exclude_locations: []

  # The year you expect to graduate. Only used by the optional auto-apply feature,
  # to skip jobs that ask for someone graduating earlier than you.
  # CHANGE THIS to your own year.
  grad_year: 2029

# Times in emails are shown in this timezone.
# Examples: America/New_York, America/Toronto, America/Chicago, America/Los_Angeles, Europe/London
timezone: America/New_York


# -----------------------------------------------------------------------------
# FIRST RUN
# By default the very first run does NOT email you everything that is open today.
# It quietly remembers every current posting, then sends ONE short email saying setup
# worked. From then on you only get emails about postings that appear after that.
# Set this to true if you do want the full list of everything currently open.
# -----------------------------------------------------------------------------
alerts:
  send_backlog_on_first_run: false


# -----------------------------------------------------------------------------
# WHERE TO LOOK (true = on, false = off)
# -----------------------------------------------------------------------------
sources:
  greenhouse: true   # companies that post on Greenhouse
  lever: true        # companies that post on Lever
  ashby: true        # companies that post on Ashby
  workday: true      # companies that post on Workday (most big banks)
  feeds: true        # company career sites with a public job feed (Scotiabank, National Bank, Canada Life)
  simplify: true     # the public SimplifyJobs internship list on GitHub (mostly tech and quant)


# -----------------------------------------------------------------------------
# OPTIONAL AI FILTER (Claude Haiku)
# Needs an Anthropic API key (see README, "API cost"). With no key the alerts
# still work, using the keyword filter only. Expect a few extra irrelevant jobs.
# -----------------------------------------------------------------------------
llm:
  enabled: true
  model: claude-haiku-4-5
  max_description_chars: 6000


# -----------------------------------------------------------------------------
# WORKDAY SETTINGS
# Workday sites only show a short list, so we search for each word below.
# max_pages: how many pages of 20 results to read per search word.
# -----------------------------------------------------------------------------
workday:
  search_terms: [intern, co-op, summer analyst, student, stagiaire]
  max_pages: 3


# -----------------------------------------------------------------------------
# EXTRAS (both OFF by default, most people never need them)
#   auto_apply: fills in application forms on your own computer. See docs/AUTO_APPLY.md.
#               It needs a database. Alerts do NOT need one.
#   dashboard:  a nightly summary email of what auto-apply did. Needs auto_apply.
# -----------------------------------------------------------------------------
features:
  auto_apply: false
  dashboard: false

auto_apply:
  daily_cap: 10                # most applications sent per day
  delay_seconds: [45, 150]     # random wait between applications


# -----------------------------------------------------------------------------
# KEYWORDS SHARED BY BOTH PRESETS
# A job is kept only if it matches: a target year AND a role word AND a level word,
# and its TITLE contains none of the exclude words.
# Matching ignores capital letters and only matches whole words.
# -----------------------------------------------------------------------------
keywords:
  # Words that say "this is for students".
  level_terms:
    - intern
    - internship
    - co-op
    - co op
    - coop
    - summer analyst
    - summer associate
    - spring week
    - spring weeks
    - spring programme
    - spring program
    - discovery day
    - insight day
    - insight programme
    - insight program
    - diversity program
    - diversity programme
    - freshman
    - sophomore
    - early insight
    - early talent

  # If these words are in the TITLE the job is dropped (too senior, or not a student job).
  exclude_title_terms:
    - senior
    - sr
    - staff
    - principal
    - manager
    - director
    - vice president
    - vp
    - head of
    - lead
    - 5+ years
    - 6+ years
    - 7+ years
    - 10+ years
    - experienced
    - full-time
    - full time
    - talent community
    - talent network

  # Jobs mentioning these get a yellow "Freshman/Sophomore Program" tag in the email.
  early_program_terms:
    - freshman
    - freshmen
    - sophomore
    - sophomores
    - rising freshman
    - rising sophomore
    - early insight
    - early identification
    - discovery day
    - discovery program
    - diversity program
    - explore program
    - spring insight
    - winter insight
    - underclassman
    - underclassmen
    - spring week


# =============================================================================
#  THE PRESETS
#  Each preset has: roles, extra level words, a plain-English focus for the AI,
#  and its list of companies. You can add or delete lines freely.
# =============================================================================
presets:

  # ===========================================================================
  #  FINANCE
  # ===========================================================================
  finance:
    # Plain-English description the AI filter uses to judge each job.
    llm_focus: >-
      finance, including investment banking, sales and trading, equity research, asset management,
      risk, corporate finance, capital markets, wealth management, accounting, and finance or business analyst roles
    domains:
      "Investment Banking": mergers and acquisitions, advisory, debt and equity financings, coverage groups
      "Sales & Trading": sales, trading, markets, flow and derivatives desks
      "Equity Research": covering companies and writing research
      "Asset Management": portfolio management, investment analysis, pensions, hedge funds, private equity
      "Risk": market, credit, operational or model risk
      "Corporate Finance": FP&A, treasury, financial planning inside a company
      "Capital Markets": capital markets origination, syndicate, structuring
      "Wealth Management": advisory, private banking, financial planning for clients
      "Accounting": accounting, audit, tax, controllership
      "Analyst": general finance or business analyst work that fits none of the above
      "Software": software engineering or data science (not finance work)

    # Words that describe the job itself. Kept wide on purpose so finance jobs are not dropped.
    roles:
      - investment banking
      - investment bank
      - investment banking division
      - ibd
      - sales and trading
      - sales & trading
