# OPTIONAL and OFF by default. Only useful together with auto-apply (docs/AUTO_APPLY.md).
# To turn on the nightly summary email:
#   1. set  features: dashboard: true  and  auto_apply: true  in config.yaml
#   2. add the DATABASE_URL secret
#   3. remove the "#" in front of the three schedule lines below
name: Auto-apply dashboard

on:
  # schedule:
  #   - cron: "17 3,4 * * *"
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-autoapply.txt
      - name: Send dashboard email
        env:
          EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python -m autoapply.dashboard
